<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>EBOOKENDO</title>
    <script>
      // Redireciona para index.html mantendo a rota na query string
      // Isso permite que a SPA processe a rota corretamente
      var l = window.location;
      var pathSegmentsToKeep = 1; // Mantém /EBOOKENDO
      
      // Constrói a URL de redirecionamento
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '/?_p=' + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&_q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
