<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>EBOOKENDO</title>
    <script>
      // Redireciona qualquer URL 404 para /EBOOKENDO/index.html
      // Isso permite que a SPA funcione com roteamento client-side
      var path = window.location.pathname;
      
      // Se a URL não começa com /EBOOKENDO/, redireciona para /EBOOKENDO/
      if (!path.startsWith('/EBOOKENDO/')) {
        window.location.replace('/EBOOKENDO/');
      } else {
        // Se já está em /EBOOKENDO/, redireciona para o index.html
        window.location.replace('/EBOOKENDO/');
      }
    </script>
  </head>
  <body>
  </body>
</html>
