<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>EBOOKENDO - Redirecionamento</title>
    <script>
      // Redireciona para a página raiz da SPA
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var pathname = l.pathname;
      var segments = pathname.split('/').filter(Boolean);
      
      // Se a URL tem mais de um segmento (ex: /EBOOKENDO/indicacoes), redireciona para /EBOOKENDO/
      if (segments.length > 1) {
        window.location.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + segments[0] + '/');
      }
    </script>
  </head>
  <body>
    <p>Redirecionando...</p>
  </body>
</html>
